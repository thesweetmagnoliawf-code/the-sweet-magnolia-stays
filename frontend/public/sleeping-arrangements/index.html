<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose your property | The Sweet Magnolia Stays</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Manrope:wght@400;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f5f0; color: #232f26; font: 1rem/1.65 Manrope, sans-serif; }
    main { width: min(100% - 2rem, 42rem); margin: 2.5rem auto 4rem; }
    header { text-align: center; margin-bottom: 2rem; }
    img { width: 8rem; height: auto; }
    h1, h2 { font-family: "Cormorant Garamond", Georgia, serif; line-height: 1.1; }
    h1 { font-size: clamp(2.7rem, 8vw, 4.5rem); margin: .3em 0; }
    h2 { font-size: 2rem; margin: 0 0 .5rem; }
    p { margin: .5rem 0; }
    section { padding: 1.4rem; margin-bottom: 1rem; border: 1px solid #d8d9cf; border-radius: .65rem; background: #fffdf8; }
    a { color: inherit; text-underline-offset: .2em; }
    .room-photo { display: block; width: 100%; height: auto; border-radius: .4rem; }
    .photos { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap: .75rem; margin-top: 1rem; }
    figure { margin: 0; }
    figcaption { margin-top: .35rem; font-size: .875rem; }
    .property { font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="../the-sweet-magnolia-logo.png" alt="The Sweet Magnolia Stays">
      <p class="property">The Sweet Magnolia Stays</p>
      <h1>Choose your property</h1>
    </header>
    <section aria-label="Property choices">
      <p>Select your property to see its sleeping arrangements.</p>
      <ul>
        <li><a href="../wake-forest/sleeping-arrangement/">Wake Forest</a></li>
        <li><a href="../raleigh/sleeping-arrangement/">Raleigh/Cary</a></li>
      </ul>
    </section>
    <p><a href="../">Back to home</a></p>
  </main>
</body>
</html>
